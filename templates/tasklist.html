{% extends "base.html" %}


{%block body%}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="text-center mb-4">Загрузка файлов</h2>

            <form action="/upload" method="post" enctype="multipart/form-data" class="p-4 border rounded shadow-sm bg-light">
                <div class="mb-3">
                    <label for="file1" class="form-label">ЭкоПласт</label>
                    <input type="file" class="form-control" id="file1" name="file1" required>
                </div>

                <div class="mb-3">
                    <label for="file2" class="form-label">СоусПак</label>
                    <input type="file" class="form-control" id="file2" name="file2" required>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Загрузить</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="{{ url_for('static', path='script.js') }}"></script>
{%endblock%}
