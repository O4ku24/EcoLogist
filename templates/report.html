{% extends "base.html" %}


{%block body%}
<div class="row justify-content-center">
    <div class="col-md-6">

        {% if error %}
            <div class="alert alert-danger text-center">{{ error }}</div>
        {% else %}
            <h2 class="text-center mb-4">Отчёт готов</h2>

            <!-- Результаты обработки -->
            <div class="card shadow-sm mb-3">
                <div class="card-header bg-success text-white">
                    <strong>Результаты</strong>
                </div>
                <div class="card-body text-center">
                    <div class="mb-4">
                        <h2 class="text-primary">{{ found }}</h2>
                        <p class="text-muted mb-0">Адресов найдено</p>
                    </div>
                    <hr>
                    <div>
                        <h3 class="text-success">Сумма: {{ "%.2f"|format(total_sum) }}</h3>
                    </div>
                </div>
            </div>

            <!-- Ссылка на скачивание -->
            <div class="text-center mt-4">
                <a href="/static/upload/{{ report_filename }}" class="btn btn-success btn-lg" download>
                    Скачать отчёт
                </a>
            </div>

            <div class="text-center mt-3">
                <a href="/tasklist/" class="btn btn-outline-secondary">Загрузить ещё файлы</a>
            </div>
        {% endif %}

    </div>
</div>
{%endblock%}
